name: Build launcher
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify updater
        shell: powershell
        run: ./tests/Run-Tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MythLauncher
          path: |
            dist/MythLauncher.exe
            dist/MythLauncher.zip
            dist/MythLauncher.zip.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version=[regex]::Match((Get-Content src/Core.cs -Raw),'Version="([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag/source version mismatch' }
          gh release create $env:GITHUB_REF_NAME dist/MythLauncher.exe dist/MythLauncher.zip dist/MythLauncher.zip.sha256 --title "1000year Launcher $version" --notes-file PATCHNOTES.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
